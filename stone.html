<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石頭點擊大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111;
            color: #eee;
            /* Use Press Start 2P for English/Numbers, standard monospace for Chinese to keep the ASCII vibe */
            font-family: 'Press Start 2P', 'Courier New', monospace; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            border: 2px dashed #888;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dashed-border {
            border: 2px dashed #888;
        }

        /* 遊戲視窗 */
        .game-view {
            position: relative;
            height: 350px;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 中央大石頭 */
        .main-stone {
            font-size: 5rem;
            cursor: pointer;
            transition: transform 0.05s;
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }
        .main-stone:active {
            transform: scale(0.9);
        }

        /* 浮動文字 */
        .floating-text {
            position: fixed;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -60px) scale(1.5); opacity: 0; }
        }

        /* 雲朵動畫 */
        .cloud {
            position: absolute;
            font-size: 2rem;
            top: 20px;
            animation: floatCloud linear infinite;
            opacity: 0.8;
            pointer-events: none;
        }
        .cloud-1 { left: -50px; animation-duration: 25s; animation-delay: 0s; }
        .cloud-2 { left: -50px; top: 60px; animation-duration: 35s; animation-delay: -15s; }

        @keyframes floatCloud {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(850px); }
        }

        /* 背景小石頭跳動 */
        .bg-stone {
            position: absolute;
            bottom: 20px;
            font-size: 1.5rem;
            animation: bounce 1.5s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        /* 樹木 */
        .tree {
            position: absolute;
            bottom: 50px;
            font-size: 2.5rem;
            pointer-events: none;
        }

        /* 錯誤閃爍紅光 */
        @keyframes flashRed {
            0% { background-color: #111; }
            50% { background-color: #511; }
            100% { background-color: #111; }
        }
        .flash-error {
            animation: flashRed 0.3s;
        }

        /* 商店按鈕 */
        .upgrade-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #222;
            cursor: pointer;
            transition: background 0.1s;
        }
        .upgrade-btn:hover {
            background-color: #333;
        }
        .upgrade-btn:active {
            background-color: #444;
        }
        .upgrade-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .upgrade-btn.disabled:hover {
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <!-- 標題 -->
        <div class="dashed-border p-4 text-center text-xl tracking-widest">
            🪨 石頭點擊大師
        </div>

        <!-- 數據區 -->
        <div class="dashed-border p-4 flex flex-col md:flex-row justify-between items-center text-sm md:text-base gap-4">
            <div>[ 📊 擁有的石頭數: <span id="stonesDisplay" class="text-yellow-400">0</span> ]</div>
            <div>[ ⚡ 每秒產量 (CPS): <span id="cpsDisplay" class="text-green-400">0</span>/s ]</div>
        </div>

        <!-- 遊戲主畫面 -->
        <div class="game-view dashed-border" id="gameView">
            <div class="cloud cloud-1">☁️</div>
            <div class="cloud cloud-2">☁️</div>
            
            <!-- 動態生成的樹木和背景石頭會被插入這裡 -->
            <div id="environmentLayer"></div>

            <div class="main-stone" id="mainStone" title="(中央大石頭 - 可點擊)">
                🪨
            </div>
        </div>

        <!-- 商店標題 -->
        <div class="dashed-border p-3 text-center text-lg">
            🛒 商店 / 升級區
        </div>

        <!-- 商店列表 -->
        <div class="dashed-border p-2 flex flex-col gap-2 text-xs md:text-sm">
            
            <div class="upgrade-btn dashed-border" id="btn-click">
                <div class="flex items-center gap-2">
                    <span>🔨</span>
                    <span>強化點擊 (+1)</span>
                </div>
                <div class="text-right text-gray-400">
                    價格: <span id="cost-click" class="text-yellow-300">10</span> 石頭 
                    <span class="ml-2">(目前等級: <span id="lvl-click">1</span>)</span>
                </div>
            </div>

            <div class="upgrade-btn dashed-border" id="btn-bgStone">
                <div class="flex items-center gap-2">
                    <span>🪨</span>
                    <span>增加背景小石頭</span>
                </div>
                <div class="text-right text-gray-400">
                    價格: <span id="cost-bgStone" class="text-yellow-300">50</span> 石頭 
                    <span class="ml-2">(目前等級: <span id="lvl-bgStone">0</span>)</span>
                </div>
            </div>

            <div class="upgrade-btn dashed-border" id="btn-tree">
                <div class="flex items-center gap-2">
                    <span>🌳</span>
                    <span>種植環境樹木</span>
                </div>
                <div class="text-right text-gray-400">
                    價格: <span id="cost-tree" class="text-yellow-300">100</span> 石頭 
                    <span class="ml-2">(目前等級: <span id="lvl-tree">0</span>)</span>
                </div>
            </div>

            <div class="upgrade-btn dashed-border" id="btn-miner">
                <div class="flex items-center gap-2">
                    <span>🤖</span>
                    <span>自動採礦機 (+1/s)</span>
                </div>
                <div class="text-right text-gray-400">
                    價格: <span id="cost-miner" class="text-yellow-300">200</span> 石頭 
                    <span class="ml-2">(目前等級: <span id="lvl-miner">0</span>)</span>
                </div>
            </div>

        </div>
        
        <!-- 重置進度按鈕 (隱藏功能，方便測試) -->
        <div class="text-right">
            <button id="resetBtn" class="text-xs text-gray-600 hover:text-red-500 underline">重置存檔</button>
        </div>
    </div>

    <script>
        // 音效 Context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'square'; // 復古 8-bit 音色
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // 音量
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playErrorSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 預設遊戲狀態
        const defaultState = {
            stones: 0,
            clickPower: 1,
            cps: 0,
            upgrades: {
                click: { level: 0, baseCost: 10 },    // 畫面顯示 level+1
                bgStone: { level: 0, baseCost: 50 },
                tree: { level: 0, baseCost: 100 },
                miner: { level: 0, baseCost: 200 }
            }
        };

        let gameState = JSON.parse(JSON.stringify(defaultState));

        // 讀取存檔
        function loadGame() {
            try {
                const saved = localStorage.getItem('stoneClickerSave');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // 簡單合併屬性，避免升級項目更新導致報錯
                    gameState.stones = parsed.stones || 0;
                    gameState.clickPower = parsed.clickPower || 1;
                    gameState.cps = parsed.cps || 0;
                    if (parsed.upgrades) {
                        for (let key in defaultState.upgrades) {
                            if (parsed.upgrades[key]) {
                                gameState.upgrades[key].level = parsed.upgrades[key].level;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("無法讀取存檔:", e);
            }
            updateAllUI();
            renderEnvironment();
        }

        // 儲存進度
        function saveGame() {
            try {
                localStorage.setItem('stoneClickerSave', JSON.stringify(gameState));
            } catch (e) {
                console.error("無法儲存:", e);
            }
        }

        // 計算升級花費: Base * (1.5 ^ level)
        function getCost(upgradeKey) {
            const up = gameState.upgrades[upgradeKey];
            return Math.floor(up.baseCost * Math.pow(1.5, up.level));
        }

        // 更新文字 UI 與按鈕狀態
        function updateAllUI() {
            // 頂部狀態
            document.getElementById('stonesDisplay').innerText = Math.floor(gameState.stones).toLocaleString();
            document.getElementById('cpsDisplay').innerText = gameState.cps.toLocaleString();

            // 更新每個升級項目的花費與等級
            const items = ['click', 'bgStone', 'tree', 'miner'];
            items.forEach(key => {
                const cost = getCost(key);
                let displayLevel = gameState.upgrades[key].level;
                if (key === 'click') displayLevel += 1; // 點擊等級從1開始顯示

                document.getElementById(`cost-${key}`).innerText = cost.toLocaleString();
                document.getElementById(`lvl-${key}`).innerText = displayLevel;

                const btn = document.getElementById(`btn-${key}`);
                if (gameState.stones >= cost) {
                    btn.classList.remove('disabled');
                } else {
                    btn.classList.add('disabled');
                }
            });
            
            // 標題也動態顯示石頭數
            document.title = `${Math.floor(gameState.stones)} 🪨 | 石頭點擊大師`;
        }

        // 渲染環境物件 (樹木、小石頭)
        function renderEnvironment() {
            const envLayer = document.getElementById('environmentLayer');
            envLayer.innerHTML = ''; // 清空

            // 生成樹木
            const treeLevel = gameState.upgrades.tree.level;
            for (let i = 0; i < treeLevel; i++) {
                const el = document.createElement('div');
                el.className = 'tree';
                el.innerText = '🌳';
                // 交錯放左右邊
                if (i % 2 === 0) {
                    el.style.left = `${10 + (i * 5)}%`;
                } else {
                    el.style.right = `${10 + ((i-1) * 5)}%`;
                }
                // 大小與高度稍微隨機化，增加層次感
                el.style.transform = `scale(${0.8 + (i%3)*0.1})`;
                el.style.bottom = `${40 + (i%2)*10}px`;
                envLayer.appendChild(el);
            }

            // 生成背景小石頭
            const bgStoneLevel = gameState.upgrades.bgStone.level;
            for (let i = 0; i < bgStoneLevel; i++) {
                const el = document.createElement('div');
                el.className = 'bg-stone';
                el.innerText = '🪨';
                // 隨機分布在底部
                el.style.left = `${10 + (i * 87) % 80}%`; // 簡單打散
                el.style.animationDelay = `${(i * 0.2) % 1.5}s`;
                el.style.fontSize = `${1 + (i%2)*0.5}rem`;
                envLayer.appendChild(el);
            }
        }

        // 浮動文字動畫
        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            
            // 動畫結束後移除
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 1000);
        }

        // === 事件監聽 ===

        // 點擊中央大石頭
        const mainStone = document.getElementById('mainStone');
        mainStone.addEventListener('mousedown', (e) => {
            initAudio(); // 初始化音效
            
            // 增加石頭
            gameState.stones += gameState.clickPower;
            
            // 音效與動畫
            playClickSound();
            createFloatingText(e.clientX, e.clientY, `+${gameState.clickPower}`);
            
            updateAllUI();
        });

        // 防止手機雙擊放大
        mainStone.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            initAudio();
            
            gameState.stones += gameState.clickPower;
            playClickSound();
            
            const touch = e.touches[0];
            createFloatingText(touch.clientX, touch.clientY, `+${gameState.clickPower}`);
            
            updateAllUI();
        });

        // 購買升級通用邏輯
        function buyUpgrade(key) {
            initAudio();
            const cost = getCost(key);
            
            if (gameState.stones >= cost) {
                // 扣款並升級
                gameState.stones -= cost;
                gameState.upgrades[key].level++;
                
                // 套用升級效果
                switch(key) {
                    case 'click':
                        gameState.clickPower++;
                        break;
                    case 'miner':
                        gameState.cps++;
                        break;
                    case 'bgStone':
                    case 'tree':
                        renderEnvironment(); // 更新視覺
                        break;
                }
                
                saveGame();
                updateAllUI();
            } else {
                // 餘額不足，閃爍紅光
                playErrorSound();
                document.body.classList.remove('flash-error');
                // 觸發 reflow 讓動畫重置
                void document.body.offsetWidth;
                document.body.classList.add('flash-error');
            }
        }

        // 綁定商店按鈕
        document.getElementById('btn-click').addEventListener('click', () => buyUpgrade('click'));
        document.getElementById('btn-bgStone').addEventListener('click', () => buyUpgrade('bgStone'));
        document.getElementById('btn-tree').addEventListener('click', () => buyUpgrade('tree'));
        document.getElementById('btn-miner').addEventListener('click', () => buyUpgrade('miner'));

        // 重置按鈕
        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm("確定要重置所有進度嗎？這無法復原！")) {
                localStorage.removeItem('stoneClickerSave');
                gameState = JSON.parse(JSON.stringify(defaultState));
                updateAllUI();
                renderEnvironment();
            }
        });

        // 自動產出 Loop (每秒執行)
        setInterval(() => {
            if (gameState.cps > 0) {
                gameState.stones += gameState.cps;
                updateAllUI();
                // 每隔幾秒自動存檔一次
                if (Math.random() < 0.2) saveGame(); 
            }
        }, 1000);
        
        // 離開前存檔 (防護)
        window.addEventListener('beforeunload', saveGame);

        // 初始化遊戲
        loadGame();

    </script>
</body>
</html>
